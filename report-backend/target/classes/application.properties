# Report Backend Configuration
quarkus.http.port=8083

# PostgreSQL Database Configuration - Development mode with H2
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:tsunami_reports;DB_CLOSE_DELAY=-1

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Neo4j Configuration (read-only for report data)
quarkus.neo4j.uri=bolt://localhost:7687
quarkus.neo4j.authentication.username=neo4j
quarkus.neo4j.authentication.password=test.password

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# OpenAPI Configuration
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Tsunami Report Backend API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para análisis de grafos Neo4j y generación de reportes de seguridad
quarkus.smallrye-openapi.info-contact-name=Tsunami Security Team
quarkus.smallrye-openapi.servers=http://localhost:8083

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.example.report".level=DEBUG

# File upload configuration
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=10M

# Report generation configuration
report.output.directory=/tmp/reports
report.template.directory=src/main/resources/templates
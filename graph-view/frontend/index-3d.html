<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsunami - 3D Graph Visualization</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }
        
        #controls h3 {
            margin: 0 0 15px 0;
            color: #4CAF50;
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #cccccc;
            font-size: 14px;
        }
        
        select, input[type="text"], input[type="number"], button {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #ffffff;
            border-radius: 5px;
            font-size: 14px;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        button {
            background: #4CAF50;
            border: none;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
            max-width: 400px;
        }
        
        #legend {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 250px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .legend-text {
            font-size: 12px;
            color: #cccccc;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            text-align: center;
            color: #4CAF50;
        }
        
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
        
        .error {
            color: #ff6b6b;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 5px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        
        #search-results {
            max-height: 200px;
            overflow-y: auto;
            background: #2a2a2a;
            border-radius: 5px;
            margin-top: 5px;
        }
        
        .search-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #444;
            transition: background 0.2s;
        }
        
        .search-item:hover {
            background: #3a3a3a;
        }
        
        .search-item:last-child {
            border-bottom: none;
        }

        #graph {
            width: 100%;
            height: 100%;
        }
        
        #mode-toggle {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #mode-toggle a {
            color: #cccccc;
            text-decoration: none;
            margin: 0 10px;
            padding: 5px 10px;
            border-radius: 15px;
            transition: all 0.3s;
        }
        
        #mode-toggle a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #4CAF50;
        }
        
        #mode-toggle a.active {
            background: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="mode-toggle">
            <a href="index.html">2D View</a>
            <a href="index-3d.html" class="active">3D View</a>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading 3D graph data...</div>
        </div>
        
        <div id="controls">
            <h3>🌊 Tsunami 3D Controls</h3>
            
            <div class="control-group">
                <label for="dataSource">Data Source:</label>
                <select id="dataSource">
                    <option value="complete">Complete Graph</option>
                    <option value="domain">Domain Focus</option>
                    <option value="provider">Provider Focus</option>
                    <option value="risk">Risk Level</option>
                    <option value="industry">Industry</option>
                    <option value="search">Search</option>
                </select>
            </div>
            
            <div class="control-group" id="domainInput" style="display:none;">
                <label for="domainName">Domain:</label>
                <input type="text" id="domainName" placeholder="example.com">
            </div>
            
            <div class="control-group" id="providerInput" style="display:none;">
                <label for="providerName">Provider:</label>
                <input type="text" id="providerName" placeholder="AWS CloudFront">
            </div>
            
            <div class="control-group" id="riskInput" style="display:none;">
                <label for="riskLevel">Risk Level:</label>
                <select id="riskLevel">
                    <option value="low">Low (0-25)</option>
                    <option value="medium">Medium (25-50)</option>
                    <option value="high">High (50-75)</option>
                    <option value="critical">Critical (75-100)</option>
                </select>
            </div>
            
            <div class="control-group" id="industryInput" style="display:none;">
                <label for="industryName">Industry:</label>
                <select id="industryName">
                    <option value="">Loading industries...</option>
                </select>
            </div>
            
            <div class="control-group" id="searchInput" style="display:none;">
                <label for="searchQuery">Search:</label>
                <input type="text" id="searchQuery" placeholder="Search nodes...">
                <div id="search-results"></div>
            </div>
            
            <div class="control-group">
                <label for="nodeLimit">Node Limit:</label>
                <input type="number" id="nodeLimit" min="10" max="1000" value="300">
            </div>
            
            <div class="control-group">
                <button id="loadGraph">Load Graph</button>
                <button id="testAPI">Test API</button>
            </div>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="showSubdomains" checked> Show Relationships
                </label>
            </div>
            
            <div class="control-group">
                <label>
                    <input type="checkbox" id="autoRotate" checked> Auto Rotate
                </label>
            </div>
        </div>
        
        <div id="legend">
            <h3>3D Legend</h3>
            <div class="legend-item">
                <div class="legend-color" style="background: #44aa44;"></div>
                <div class="legend-text">Low Risk Domain</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ff8800;"></div>
                <div class="legend-text">Medium Risk Domain</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ff4444;"></div>
                <div class="legend-text">High Risk Domain</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #4488ff;"></div>
                <div class="legend-text">CDN Provider</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffcc44;"></div>
                <div class="legend-text">Technology</div>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #cc44ff;"></div>
                <div class="legend-text">Service</div>
            </div>
        </div>
        
        <div id="info">
            <div id="nodeInfo">
                <strong>3D Graph Visualization</strong><br>
                <small>Backend: <span id="backendStatus">Connecting...</span></small><br>
                <small>Mouse: orbit, wheel: zoom</small>
            </div>
            <div id="graphStats" style="margin-top: 10px; font-size: 12px; color: #888;">
                Nodes: 0 | Edges: 0
            </div>
        </div>

        <div id="graph"></div>
    </div>
    
    <!-- 3D Force Graph -->
    <script src="https://unpkg.com/3d-force-graph@1.70.19/dist/3d-force-graph.min.js"></script>
    
    <script>
        class Graph3DVisualization {
            constructor() {
                this.apiBaseUrl = 'http://localhost:8500';
                this.graph = null;
                this.currentData = { nodes: [], links: [] };
                
                this.setupEventListeners();
                this.initializeGraph();
                this.testConnection();
                this.loadInitialData();
            }
            
            initializeGraph() {
                const container = document.getElementById('graph');
                
                // Wait for ForceGraph3D to be loaded
                if (typeof ForceGraph3D === 'undefined') {
                    setTimeout(() => this.initializeGraph(), 100);
                    return;
                }
                
                this.graph = ForceGraph3D()
                    (container)
                    .backgroundColor('#0a0a0a')
                    .showNavInfo(false)
                    .nodeLabel(node => `${node.label}`)
                    .nodeColor(node => node.color)
                    .nodeVal(node => Math.max(2, node.size))
                    .linkColor(link => link.color || '#666666')
                    .linkWidth(2)
                    .linkOpacity(0.6)
                    .onNodeClick(node => this.onNodeClick(node))
                    .onNodeHover(node => this.onNodeHover(node))
                    .cooldownTicks(100)
                    .d3AlphaDecay(0.02)
                    .d3VelocityDecay(0.3);
                
                // Enable controls
                this.graph.enableNodeDrag(false);
                this.graph.controls().enableDamping = true;
                this.graph.controls().dampingFactor = 0.1;
                this.graph.controls().autoRotate = true;
                this.graph.controls().autoRotateSpeed = 0.5;
            }
            
            setupEventListeners() {
                const dataSource = document.getElementById('dataSource');
                const loadButton = document.getElementById('loadGraph');
                const testButton = document.getElementById('testAPI');
                const autoRotateCheck = document.getElementById('autoRotate');
                
                if (dataSource) dataSource.addEventListener('change', () => this.onDataSourceChange());
                if (loadButton) loadButton.addEventListener('click', () => this.loadGraphData());
                if (testButton) testButton.addEventListener('click', () => this.testConnection());
                if (autoRotateCheck) {
                    autoRotateCheck.addEventListener('change', (e) => {
                        if (this.graph && this.graph.controls) {
                            this.graph.controls().autoRotate = e.target.checked;
                        }
                    });
                }
                
                // Handle window resize
                window.addEventListener('resize', () => this.handleResize());
            }
            
            async loadInitialData() {
                // Auto-load complete graph with small limit on startup
                await this.loadGraphData();
            }
            
            onDataSourceChange() {
                const dataSource = document.getElementById('dataSource').value;
                
                // Hide all input groups first
                const inputs = ['domainInput', 'providerInput', 'riskInput', 'industryInput', 'searchInput'];
                inputs.forEach(id => {
                    const element = document.getElementById(id);
                    if (element) element.style.display = 'none';
                });
                
                // Show relevant input group
                switch(dataSource) {
                    case 'domain':
                        const domainInput = document.getElementById('domainInput');
                        if (domainInput) domainInput.style.display = 'block';
                        break;
                    case 'provider':
                        const providerInput = document.getElementById('providerInput');
                        if (providerInput) providerInput.style.display = 'block';
                        break;
                    case 'risk':
                        const riskInput = document.getElementById('riskInput');
                        if (riskInput) riskInput.style.display = 'block';
                        break;
                    case 'industry':
                        const industryInput = document.getElementById('industryInput');
                        if (industryInput) industryInput.style.display = 'block';
                        this.loadIndustries();
                        break;
                    case 'search':
                        const searchInput = document.getElementById('searchInput');
                        if (searchInput) searchInput.style.display = 'block';
                        break;
                }
            }
            
            async testConnection() {
                try {
                    const statusElement = document.getElementById('backendStatus');
                    if (statusElement) statusElement.textContent = 'Testing...';
                    
                    const response = await fetch(`${this.apiBaseUrl}/health`);
                    const data = await response.json();
                    
                    if (statusElement) {
                        if (data.status === 'healthy') {
                            statusElement.textContent = '✅ Connected';
                            statusElement.style.color = '#4CAF50';
                        } else {
                            statusElement.textContent = '⚠️ Issues';
                            statusElement.style.color = '#ff8800';
                        }
                    }
                    
                } catch (error) {
                    const statusElement = document.getElementById('backendStatus');
                    if (statusElement) {
                        statusElement.textContent = '❌ Offline';
                        statusElement.style.color = '#ff4444';
                    }
                    console.error('Backend connection failed:', error);
                }
            }
            
            async loadIndustries() {
                try {
                    const industrySelect = document.getElementById('industryName');
                    if (!industrySelect) return;
                    
                    industrySelect.innerHTML = '<option value="">Loading industries...</option>';
                    
                    const response = await fetch(`${this.apiBaseUrl}/industries`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    // Clear and populate the select
                    industrySelect.innerHTML = '<option value="">Select an industry...</option>';
                    data.industries.forEach(industry => {
                        const option = document.createElement('option');
                        option.value = industry.name;
                        option.textContent = `${industry.name} (${industry.domain_count})`;
                        industrySelect.appendChild(option);
                    });
                    
                } catch (error) {
                    console.error('Failed to load industries:', error);
                    const industrySelect = document.getElementById('industryName');
                    if (industrySelect) {
                        industrySelect.innerHTML = '<option value="">Error loading industries</option>';
                    }
                }
            }
            
            async loadGraphData() {
                this.showLoading(true);
                
                try {
                    const dataSource = document.getElementById('dataSource')?.value || 'complete';
                    const nodeLimit = document.getElementById('nodeLimit')?.value || 50;
                    const showSubdomains = document.getElementById('showSubdomains')?.checked || false;
                    
                    let url = `${this.apiBaseUrl}/graph/`;
                    
                    switch(dataSource) {
                        case 'complete':
                            url += `complete?limit=${nodeLimit}&include_subdomains=${showSubdomains}`;
                            break;
                        case 'domain':
                            const domain = document.getElementById('domainName')?.value;
                            if (!domain) {
                                throw new Error('Please enter a domain name');
                            }
                            url += `domain/${encodeURIComponent(domain)}`;
                            break;
                        case 'provider':
                            const provider = document.getElementById('providerName')?.value;
                            if (!provider) {
                                throw new Error('Please enter a provider name');
                            }
                            url += `provider/${encodeURIComponent(provider)}?limit=${nodeLimit}`;
                            break;
                        case 'risk':
                            const riskLevel = document.getElementById('riskLevel')?.value;
                            url += `risk/${riskLevel}?limit=${nodeLimit}`;
                            break;
                        case 'industry':
                            const industry = document.getElementById('industryName')?.value;
                            if (!industry) {
                                throw new Error('Please select an industry');
                            }
                            // Always include providers for industry queries as requested by user
                            url += `industry/${encodeURIComponent(industry)}?limit=${nodeLimit}&include_providers=true`;
                            break;
                        case 'search':
                            const searchQuery = document.getElementById('searchQuery')?.value;
                            if (!searchQuery) {
                                throw new Error('Please enter a search query');
                            }
                            url += `search?query_string=${encodeURIComponent(searchQuery)}&limit=${nodeLimit}`;
                            break;
                    }
                    
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    this.render3DGraph(data);
                    
                } catch (error) {
                    this.showError(error.message);
                } finally {
                    this.showLoading(false);
                }
            }
            
            render3DGraph(data) {
                if (!this.graph) return;
                
                // Transform nodes
                const nodes = data.nodes.map(node => ({
                    id: node.id,
                    label: node.label,
                    labels: node.labels,
                    properties: node.properties,
                    color: node.color,
                    size: node.size || 5
                }));
                
                // Transform edges to links
                const links = data.edges.map(edge => ({
                    id: edge.id,
                    source: edge.source,
                    target: edge.target,
                    relationship_type: edge.relationship_type,
                    properties: edge.properties,
                    color: edge.color,
                    weight: edge.weight || 1
                }));
                
                this.currentData = { nodes, links };
                this.graph.graphData(this.currentData);
                
                // Update stats
                const statsElement = document.getElementById('graphStats');
                if (statsElement) {
                    statsElement.innerHTML = `Nodes: ${nodes.length} | Edges: ${links.length}`;
                }
                
                console.log('3D Graph rendered:', data.metadata);
            }
            
            onNodeClick(node) {
                this.displayNodeInfo(node);
            }
            
            onNodeHover(node) {
                if (node) {
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'default';
                }
            }
            
            displayNodeInfo(node) {
                const infoDiv = document.getElementById('nodeInfo');
                if (!infoDiv) return;
                
                let html = `<strong>${node.label}</strong><br>`;
                html += `<small>Type: ${(node.labels || []).join(', ')}</small><br><br>`;
                
                // Display key properties
                const props = node.properties || {};
                if (props.risk_score !== undefined) {
                    html += `Risk Score: <span style="color: ${this.getRiskColor(props.risk_score)}">${props.risk_score}</span><br>`;
                }
                if (props.fqdn) {
                    html += `FQDN: ${props.fqdn}<br>`;
                }
                if (props.type) {
                    html += `Type: ${props.type}<br>`;
                }
                if (props.country) {
                    html += `Country: ${props.country}<br>`;
                }
                
                infoDiv.innerHTML = html;
            }
            
            getRiskColor(score) {
                if (score >= 70) return '#ff4444';
                if (score >= 40) return '#ff8800';
                return '#44aa44';
            }
            
            handleResize() {
                if (this.graph) {
                    // Force graph to resize
                    this.graph.width(window.innerWidth).height(window.innerHeight);
                }
            }
            
            showLoading(show) {
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.classList.toggle('hidden', !show);
                }
            }
            
            showError(message) {
                const infoDiv = document.getElementById('nodeInfo');
                if (infoDiv) {
                    infoDiv.innerHTML = `<div class="error">Error: ${message}</div>`;
                }
            }
        }
        
        // Initialize the 3D visualization when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Small delay to ensure all scripts are loaded
            setTimeout(() => {
                new Graph3DVisualization();
            }, 100);
        });
    </script>
</body>
</html>

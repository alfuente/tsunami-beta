# AI Provider Configuration
ai_provider: "mistral"  # Options: "ollama", "anthropic", "mistral"

ollama:
  host: "http://localhost:11434"
  model: "mistral:7b"
  timeout: 600
  max_tokens: 2048

anthropic:
  api_key: "${ANTHROPIC_API_KEY}"  # Set via environment variable
  model: "claude-3-5-sonnet-20241022"
  timeout: 300
  max_tokens: 4096

mistral:
  api_key: "${MISTRAL_API_KEY}"  # Set via environment variable
  model: "mistral-small-latest"  # Options: mistral-large-latest, mistral-small-latest, codestral-latest
  timeout: 300
  max_tokens: 4096

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "test.password"
  database: "neo4j"

server:
  host: "0.0.0.0"
  port: 8003
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
